# ============================================================================
# Hartford Claims Data Store - datasource configuration
#
# Points at Snowflake. The Oracle 19c block is retained (commented) only as a
# record of what was decommissioned. See docs/MIGRATION.md.
# ============================================================================

# --- ACTIVE: Snowflake ------------------------------------------------------
db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://hartford.us-east-1.snowflakecomputing.com/?warehouse=CLAIMS_WH&db=HARTFORD&schema=CLAIMS&role=CLAIMS_APP_RW
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=CLAIMS
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
# Password is injected from the SNOWFLAKE_APP_PASSWORD environment variable.
db.pool.maxSize=15
# Warehouse/database/schema/role come from the URL, so no connection-init SQL is
# needed; set db.pool.connectionInitSql=USE SCHEMA HARTFORD.CLAIMS to override.

