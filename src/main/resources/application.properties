# ============================================================================
# Hartford Claims Data Store - datasource configuration (Snowflake)
#
# The JDBC URL is built by DataSourceFactory as
#   jdbc:snowflake://<db.account>.snowflakecomputing.com/?warehouse=...&db=...&schema=...&role=...
# Set db.url instead to override it entirely. See docs/MIGRATION.md section 7.
# ============================================================================

db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.account=hartford.us-east-1
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=CLAIMS
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
# Credentials come from the environment, never this file:
#   SNOWFLAKE_PRIVATE_KEY_FILE (+ optional SNOWFLAKE_PRIVATE_KEY_PWD) for key-pair auth (preferred), or
#   SNOWFLAKE_APP_PASSWORD for password auth.
db.pool.maxSize=15

# --- Nightly extract (COPY INTO @stage) --------------------------------------
# Named stage + file format are created by db/snowflake/05_etl_stage.sql.
etl.stage=@claims_extract_stage
etl.fileFormat=psv_format
