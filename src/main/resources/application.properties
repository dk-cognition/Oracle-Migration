# ============================================================================
# Hartford Claims Data Store - datasource configuration
#
# Currently points at Oracle 19c. The Oracle-to-Snowflake migration replaces
# the block below with the snowflake.* settings (kept here, commented, as the
# migration target). See docs/MIGRATION.md.
# ============================================================================

# --- ACTIVE: Oracle 19c -----------------------------------------------------
db.driver=oracle.jdbc.OracleDriver
db.url=jdbc:oracle:thin:@HRTFD_PROD
db.tns.admin=src/main/resources
db.schema=HARTFORD
db.username=hartford_app
# Password is injected from the ORACLE_APP_PASSWORD environment variable.
db.pool.maxSize=15
db.pool.connectionInitSql=ALTER SESSION SET CURRENT_SCHEMA = HARTFORD

