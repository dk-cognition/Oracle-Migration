# ============================================================================
# Hartford Claims Data Store - datasource configuration
#
# Points at Snowflake following the Oracle-to-Snowflake migration.
# See docs/MIGRATION.md.
# ============================================================================

db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://hartford.us-east-1.snowflakecomputing.com
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=CLAIMS
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
# Password is injected from the SNOWFLAKE_APP_PASSWORD environment variable.
db.pool.maxSize=15
