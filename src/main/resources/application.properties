# ============================================================================
# Hartford Claims Data Store - datasource configuration
#
# Migrated to Snowflake. The active block below points at Snowflake; the former
# Oracle 19c block is kept commented for reference. See docs/MIGRATION.md.
# ============================================================================

# --- ACTIVE: Snowflake ------------------------------------------------------
db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://hartford.us-east-1.snowflakecomputing.com/?warehouse=CLAIMS_WH&db=HARTFORD&schema=HARTFORD&role=CLAIMS_APP_RW
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=HARTFORD
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
# Password is injected from the SNOWFLAKE_APP_PASSWORD environment variable.
db.pool.maxSize=15
# Snowflake session default schema (replaces Oracle ALTER SESSION SET CURRENT_SCHEMA).
db.pool.connectionInitSql=USE SCHEMA HARTFORD.HARTFORD

