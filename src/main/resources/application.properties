# ============================================================================
# Hartford Claims Data Store - datasource configuration
#
# Migrated to Snowflake. There is no TNS descriptor and no vendor pool tuning:
# warehouse/database/schema/role are carried on the JDBC URL. The password is
# injected from the SNOWFLAKE_APP_PASSWORD environment variable.
# See docs/MIGRATION.md section 7.
# ============================================================================

db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://hartford.us-east-1.snowflakecomputing.com
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=CLAIMS
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
db.pool.maxSize=15
