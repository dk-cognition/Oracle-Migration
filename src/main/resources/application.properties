# ============================================================================
# Hartford Claims Data Store - datasource configuration (Snowflake)
#
# Migrated from Oracle 19c. Credentials are never stored here:
#   SNOWFLAKE_PRIVATE_KEY_FILE (+ optional SNOWFLAKE_PRIVATE_KEY_FILE_PWD)
#     -> key-pair auth (preferred), otherwise
#   SNOWFLAKE_APP_PASSWORD -> password auth.
# See docs/MIGRATION.md.
# ============================================================================

db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://hartford.us-east-1.snowflakecomputing.com
db.warehouse=CLAIMS_WH
db.database=HARTFORD
db.schema=CLAIMS
db.role=CLAIMS_APP_RW
db.username=HARTFORD_APP
db.pool.maxSize=15
